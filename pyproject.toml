[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nflojax"
version = "0.2.0"
description = "Minimal normalizing flows in JAX"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "flax>=0.8",
]

[project.urls]
Homepage = "https://github.com/alexxthiery/nflojax"
Repository = "https://github.com/alexxthiery/nflojax"

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
markers = [
    "slow: integration, full-Jacobian, or precision-proof tests excluded from the default fast suite",
    "requires_x64: precision-proof tests that should run only with JAX_ENABLE_X64=1",
]

[tool.setuptools.packages.find]
include = ["nflojax*"]
